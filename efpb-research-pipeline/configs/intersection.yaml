experiment_version: "0.1.0-provisional"
backend: surrogate
time_step_s: 1
warmup_s: 60
evaluation_s: 300
decision_interval_s: 1
network:
  name: four_arm_through_only
  speed_limit_mps: 13.9
  approach_length_m: 150
  crosswalk_length_m: 12
  lane_width_m: 3.5
  standard: "MUTCD-style provisional; verify jurisdiction before confirmatory runs"
signal:
  phases: [P_ALL, V_NS, V_EW]
  min_green_s: 10
  service_duration_s: 25
  yellow_s: 3
  all_red_s: 1
  pedestrian_clearance_s: 10
  fixed_cycle_s: 90
  fixed_splits_s: {P_ALL: 20, V_NS: 35, V_EW: 35}
controller:
  horizon_s: 60
  candidate_duration_grid_s: [15, 25, 35]
  delta: 0.05
  epsilon: 0.000001
  efficiency_floor: 1.0
  delay_cost_p: 1.0
  delay_cost_v: 1.0
  switch_cost: 5.0
  ped_wait_limit_s: 100.0
  vehicle_wait_limit_s: 100.0
  base_weight_p: 1.0
  base_weight_v: 1.0
  debt_kappa: 2.0
  debt_eta: 1.0
  stale_after_s: 5.0
  minimum_quality: 0.7
  stop_speed_mps: 0.1
  counterfactual:
    max_distance: 4
    feature_steps: {ped_queue: 1, veh_queue: 1, ped_max_wait_s: 5, veh_max_wait_s: 5}
  calibration_status: provisional
demand:
  pedestrian_rates_per_s: {L: 0.03, M: 0.07, H: 0.11, X: 0.15}
  vehicle_rates_per_s: {L: 0.10, M: 0.22, H: 0.34, X: 0.44}
  process: poisson_approximation
  pedestrian_capacity_per_s: 1.0
  vehicle_capacity_per_s: 0.8
  walking_speed_mps: 1.2
  impaired_walking_speed_mps: 0.8
  occupancy_mean: 1.3
sensor:
  missed_detection_probability: 0.0
  false_positive_probability: 0.0
  latency_s: 0
  quality: 1.0
emergency:
  enabled: false
  requests: []
